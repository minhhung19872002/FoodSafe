name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FoodSafe.FE/package-lock.json

      - name: Restore backend
        working-directory: FoodSafe.BE
        run: |
          dotnet tool restore
          dotnet restore FoodSafe.sln

      - name: Verify backend formatting
        working-directory: FoodSafe.BE
        run: dotnet format FoodSafe.sln --verify-no-changes --no-restore

      - name: Build backend
        working-directory: FoodSafe.BE
        run: >
          dotnet build FoodSafe.sln
          --configuration Release
          --no-restore
          --warnaserror

      - name: Test backend
        working-directory: FoodSafe.BE
        run: >
          dotnet test FoodSafe.sln
          --configuration Release
          --no-build
          --no-restore
          --verbosity normal
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Publish backend deliverables
        working-directory: FoodSafe.BE
        run: |
          dotnet publish src/FoodSafe.HttpApi.Host/FoodSafe.HttpApi.Host.csproj --configuration Release --no-build --no-restore --output publish/api
          dotnet publish src/FoodSafe.DbMigrator/FoodSafe.DbMigrator.csproj --configuration Release --no-build --no-restore --output publish/migrator

      - name: Reject pending EF model changes
        id: ef-drift
        working-directory: FoodSafe.BE
        run: >
          dotnet ef migrations has-pending-model-changes
          --project src/FoodSafe.EntityFrameworkCore
          --startup-project src/FoodSafe.HttpApi.Host
          --configuration Release
          --no-build

      - name: Show model drift details
        if: failure() && steps.ef-drift.outcome == 'failure'
        working-directory: FoodSafe.BE
        run: |
          dotnet ef migrations add CiDriftProbe \
            --project src/FoodSafe.EntityFrameworkCore \
            --startup-project src/FoodSafe.HttpApi.Host \
            --configuration Release --no-build || true
          git diff --stat
          cat src/FoodSafe.EntityFrameworkCore/Migrations/*CiDriftProbe.cs || true
          git diff -- src/FoodSafe.EntityFrameworkCore/Migrations/FoodSafeDbContextModelSnapshot.cs | head -200

      - name: Restore frontend
        working-directory: FoodSafe.FE
        run: npm ci

      - name: Lint and type-check frontend
        working-directory: FoodSafe.FE
        run: |
          npm run format:check
          npm run lint
          npm run lint:ts

      - name: Test frontend
        working-directory: FoodSafe.FE
        run: npm test -- --run

      - name: Build frontend
        working-directory: FoodSafe.FE
        run: npm run build

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: FoodSafe.BE/TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 14

  database:
    name: Clean PostgreSQL migration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: FoodSafe_CI
          POSTGRES_USER: foodsafe_ci
          POSTGRES_PASSWORD: ci-database-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foodsafe_ci -d FoodSafe_CI"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=127.0.0.1;Port=5432;Database=FoodSafe_CI;Username=foodsafe_ci;Password=ci-database-only

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore backend and tools
        working-directory: FoodSafe.BE
        run: |
          dotnet tool restore
          dotnet restore FoodSafe.sln

      - name: Apply all migrations to a clean database
        working-directory: FoodSafe.BE
        run: >
          dotnet ef database update
          --project src/FoodSafe.EntityFrameworkCore
          --startup-project src/FoodSafe.HttpApi.Host
          --configuration Release

      - name: Reject model drift after clean migration
        id: ef-drift-db
        working-directory: FoodSafe.BE
        run: >
          dotnet ef migrations has-pending-model-changes
          --project src/FoodSafe.EntityFrameworkCore
          --startup-project src/FoodSafe.HttpApi.Host
          --configuration Release
          --no-build

      - name: Show model drift details
        if: failure() && steps.ef-drift-db.outcome == 'failure'
        working-directory: FoodSafe.BE
        run: |
          dotnet ef migrations add CiDriftProbe \
            --project src/FoodSafe.EntityFrameworkCore \
            --startup-project src/FoodSafe.HttpApi.Host \
            --configuration Release --no-build || true
          git diff --stat
          cat src/FoodSafe.EntityFrameworkCore/Migrations/*CiDriftProbe.cs || true
          git diff -- src/FoodSafe.EntityFrameworkCore/Migrations/FoodSafeDbContextModelSnapshot.cs | head -200

      - name: Backup and restore rehearsal (B-2 disaster-recovery gate)
        env:
          # Target the job's PostgreSQL service container directly (no Compose here).
          PG_CONTAINER: ${{ job.services.postgres.id }}
          POSTGRES_DB: FoodSafe_CI
          POSTGRES_USER: foodsafe_ci
        run: bash scripts/rehearse-restore.sh

  supply-chain:
    name: Dependency and container gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ASPNETCORE_ENVIRONMENT: Production
      PUBLIC_BASE_URL: https://foodsafe.example.invalid
      REQUIRE_HTTPS_METADATA: "true"
      POSTGRES_PASSWORD: ci-render-only-postgres-password
      POSTGRES_SSL_MODE: Require
      REDIS_PASSWORD: ci-render-only-redis-password
      MINIO_ROOT_USER: ci-render-only
      MINIO_ROOT_PASSWORD: ci-render-only-minio-password
      STRING_ENCRYPTION_PASSPHRASE: ci-render-only-passphrase-32-characters
      SEED_ADMIN_PASSWORD: Ci-render-only-bootstrap-password-9!
      DATA_PROTECTION_CERTIFICATE_PASSWORD: ci-render-only-certificate-password
      CAPTCHA_SITE_KEY: ci-render-only-turnstile-site-key
      CAPTCHA_SECRET_KEY: ci-render-only-turnstile-secret-key
      CAPTCHA_EXPECTED_HOSTNAME: foodsafe.example.invalid
      SMTP_FROM_ADDRESS: noreply@foodsafe.example.invalid
      SMTP_FROM_NAME: FoodSafe
      SMTP_HOST: smtp.example.invalid
      SMTP_PORT: "587"
      SMTP_ENABLE_SSL: "true"
      SMTP_USE_DEFAULT_CREDENTIALS: "false"
      SMTP_USERNAME: ci-render-only
      SMTP_PASSWORD: ci-render-only-password

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FoodSafe.FE/package-lock.json

      - name: Audit backend dependencies
        working-directory: FoodSafe.BE
        run: |
          dotnet restore FoodSafe.sln
          pwsh ../scripts/Test-NuGetVulnerabilities.ps1

      - name: Audit production frontend dependencies
        working-directory: FoodSafe.FE
        run: |
          npm ci
          pwsh ../scripts/Test-NpmVulnerabilities.ps1

      - name: Scan repository for secrets and insecure configuration
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true

      - name: Validate production Compose rendering
        working-directory: FoodSafe.BE
        run: docker compose config --quiet

      - name: Build deployable images
        working-directory: FoodSafe.BE
        run: docker compose build api migrator frontend

      - name: Validate production Compose overlay rendering
        working-directory: FoodSafe.BE
        env:
          # Placeholder paths — overlay uses ${SSL_CERT_PATH:?}/${SSL_KEY_PATH:?}
          # only for read-only volume mounts; config rendering just needs them set.
          SSL_CERT_PATH: /tmp/ci-placeholder-tls.crt
          SSL_KEY_PATH: /tmp/ci-placeholder-tls.key
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

      - name: Build production frontend image (Dockerfile.prod)
        working-directory: FoodSafe.BE
        env:
          SSL_CERT_PATH: /tmp/ci-placeholder-tls.crt
          SSL_KEY_PATH: /tmp/ci-placeholder-tls.key
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml build frontend

      - name: Verify production frontend HTTPS/TLS/HSTS/IPv6 at runtime
        run: bash scripts/verify-prod-frontend.sh

      - name: Scan API image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: foodsafe-api:latest
          trivyignores: .trivyignore
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: true

      - name: Scan migrator image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: foodsafe-migrator:latest
          trivyignores: .trivyignore
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: true

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: foodsafe-frontend:latest
          trivyignores: .trivyignore
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: true
