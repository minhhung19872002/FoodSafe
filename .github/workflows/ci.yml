name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FoodSafe.FE/package-lock.json

      - name: Restore backend
        working-directory: FoodSafe.BE
        run: |
          dotnet tool restore
          dotnet restore FoodSafe.sln

      - name: Verify backend formatting
        working-directory: FoodSafe.BE
        run: dotnet format FoodSafe.sln --verify-no-changes --no-restore

      - name: Build backend
        working-directory: FoodSafe.BE
        run: >
          dotnet build FoodSafe.sln
          --configuration Release
          --no-restore
          --warnaserror

      - name: Test backend
        working-directory: FoodSafe.BE
        run: >
          dotnet test FoodSafe.sln
          --configuration Release
          --no-build
          --no-restore
          --verbosity normal
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Publish backend deliverables
        working-directory: FoodSafe.BE
        run: |
          dotnet publish src/FoodSafe.HttpApi.Host/FoodSafe.HttpApi.Host.csproj --configuration Release --no-build --no-restore --output publish/api
          dotnet publish src/FoodSafe.DbMigrator/FoodSafe.DbMigrator.csproj --configuration Release --no-build --no-restore --output publish/migrator

      - name: Reject pending EF model changes
        id: ef-drift
        working-directory: FoodSafe.BE
        run: >
          dotnet ef migrations has-pending-model-changes
          --project src/FoodSafe.EntityFrameworkCore
          --startup-project src/FoodSafe.HttpApi.Host
          --configuration Release
          --no-build

      - name: Show model drift details
        if: failure() && steps.ef-drift.outcome == 'failure'
        working-directory: FoodSafe.BE
        run: |
          dotnet ef migrations add CiDriftProbe \
            --project src/FoodSafe.EntityFrameworkCore \
            --startup-project src/FoodSafe.HttpApi.Host \
            --configuration Release --no-build || true
          git diff --stat
          cat src/FoodSafe.EntityFrameworkCore/Migrations/*CiDriftProbe.cs || true
          git diff -- src/FoodSafe.EntityFrameworkCore/Migrations/FoodSafeDbContextModelSnapshot.cs | head -200

      - name: Restore frontend
        working-directory: FoodSafe.FE
        run: npm ci

      - name: Lint and type-check frontend
        working-directory: FoodSafe.FE
        run: |
          npm run format:check
          npm run lint
          npm run lint:ts

      - name: Test frontend
        working-directory: FoodSafe.FE
        run: npm test -- --run

      - name: Build frontend
        working-directory: FoodSafe.FE
        run: npm run build

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: FoodSafe.BE/TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: Real-stack Playwright acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FoodSafe.FE/package-lock.json

      # CI-only credentials: this stack lives for one job on an isolated runner.
      - name: Create CI environment file
        working-directory: FoodSafe.BE
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=FoodSafe
          POSTGRES_USER=foodsafe
          POSTGRES_PASSWORD=ci-e2e-only-postgres-password
          POSTGRES_PORT=5433
          POSTGRES_SSL_MODE=Disable
          MINIO_ROOT_USER=foodsafe-minio
          MINIO_ROOT_PASSWORD=ci-e2e-only-minio-password
          MINIO_API_PORT=9000
          MINIO_CONSOLE_PORT=9001
          STRING_ENCRYPTION_PASSPHRASE=ci-e2e-only-passphrase-32-characters!
          CAPTCHA_SITE_KEY=1x00000000000000000000AA
          CAPTCHA_SECRET_KEY=1x0000000000000000000000000000000AA
          CAPTCHA_EXPECTED_HOSTNAME=localhost
          SMTP_FROM_ADDRESS=noreply@foodsafe.local
          SMTP_FROM_NAME=FoodSafe
          SMTP_HOST=mailpit
          SMTP_PORT=1025
          MAILPIT_SMTP_PORT=1025
          MAILPIT_WEB_PORT=8025
          SMTP_ENABLE_SSL=false
          SMTP_USE_DEFAULT_CREDENTIALS=true
          SMTP_USERNAME=
          SMTP_PASSWORD=
          DATA_PROTECTION_CERTIFICATE_PASSWORD=
          SEED_ADMIN_EMAIL=admin@foodsafe.local
          SEED_ADMIN_PASSWORD=Ci-e2e-only-bootstrap-password-9!
          PUBLIC_BASE_URL=http://localhost:8080
          WEB_PORT=8080
          WEB_BIND_ADDRESS=127.0.0.1
          INFRA_BIND_ADDRESS=127.0.0.1
          REDIS_PORT=6379
          REDIS_PASSWORD=ci-e2e-only-redis-password
          ASPNETCORE_ENVIRONMENT=Development
          REQUIRE_HTTPS_METADATA=false
          EOF

      - name: Build and start the full stack
        working-directory: FoodSafe.BE
        run: |
          docker compose build api migrator frontend
          docker compose up -d

      - name: Wait for the stack to become healthy
        working-directory: FoodSafe.BE
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              "http://127.0.0.1:8080/api/abp/application-configuration?IncludeLocalizationResources=false" || true)
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "Stack did not become healthy in time." >&2
          docker compose ps
          docker compose logs --tail 100 migrator api
          exit 1

      - name: Install frontend dependencies and browsers
        working-directory: FoodSafe.FE
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # workers=1: acceptance policy — the suite runs against one shared stack.
      - name: Run Playwright acceptance suite (no API interception)
        working-directory: FoodSafe.FE
        env:
          E2E_ADMIN_PASSWORD: Ci-e2e-only-bootstrap-password-9!
        run: npx playwright test --workers=1

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            FoodSafe.FE/test-results
            FoodSafe.FE/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Tear down the stack
        if: always()
        working-directory: FoodSafe.BE
        run: docker compose down -v

  database:
    name: Clean PostgreSQL migration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: FoodSafe_CI
          POSTGRES_USER: foodsafe_ci
          POSTGRES_PASSWORD: ci-database-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foodsafe_ci -d FoodSafe_CI"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=127.0.0.1;Port=5432;Database=FoodSafe_CI;Username=foodsafe_ci;Password=ci-database-only

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore backend and tools
        working-directory: FoodSafe.BE
        run: |
          dotnet tool restore
          dotnet restore FoodSafe.sln

      - name: Apply all migrations to a clean database
        working-directory: FoodSafe.BE
        run: >
          dotnet ef database update
          --project src/FoodSafe.EntityFrameworkCore
          --startup-project src/FoodSafe.HttpApi.Host
          --configuration Release

      - name: Reject model drift after clean migration
        id: ef-drift-db
        working-directory: FoodSafe.BE
        run: >
          dotnet ef migrations has-pending-model-changes
          --project src/FoodSafe.EntityFrameworkCore
          --startup-project src/FoodSafe.HttpApi.Host
          --configuration Release
          --no-build

      - name: Show model drift details
        if: failure() && steps.ef-drift-db.outcome == 'failure'
        working-directory: FoodSafe.BE
        run: |
          dotnet ef migrations add CiDriftProbe \
            --project src/FoodSafe.EntityFrameworkCore \
            --startup-project src/FoodSafe.HttpApi.Host \
            --configuration Release --no-build || true
          git diff --stat
          cat src/FoodSafe.EntityFrameworkCore/Migrations/*CiDriftProbe.cs || true
          git diff -- src/FoodSafe.EntityFrameworkCore/Migrations/FoodSafeDbContextModelSnapshot.cs | head -200

      - name: Backup and restore rehearsal (B-2 disaster-recovery gate)
        env:
          # Target the job's PostgreSQL service container directly (no Compose here).
          PG_CONTAINER: ${{ job.services.postgres.id }}
          POSTGRES_DB: FoodSafe_CI
          POSTGRES_USER: foodsafe_ci
        run: bash scripts/rehearse-restore.sh

      - name: Migration non-destructive regression (B-4)
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: foodsafe_ci
          PGPASSWORD: ci-database-only
        run: bash scripts/verify-migration-nondestructive.sh

  supply-chain:
    name: Dependency and container gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ASPNETCORE_ENVIRONMENT: Production
      PUBLIC_BASE_URL: https://foodsafe.example.invalid
      REQUIRE_HTTPS_METADATA: "true"
      POSTGRES_PASSWORD: ci-render-only-postgres-password
      POSTGRES_SSL_MODE: Require
      REDIS_PASSWORD: ci-render-only-redis-password
      MINIO_ROOT_USER: ci-render-only
      MINIO_ROOT_PASSWORD: ci-render-only-minio-password
      STRING_ENCRYPTION_PASSPHRASE: ci-render-only-passphrase-32-characters
      SEED_ADMIN_PASSWORD: Ci-render-only-bootstrap-password-9!
      DATA_PROTECTION_CERTIFICATE_PASSWORD: ci-render-only-certificate-password
      CAPTCHA_SITE_KEY: ci-render-only-turnstile-site-key
      CAPTCHA_SECRET_KEY: ci-render-only-turnstile-secret-key
      CAPTCHA_EXPECTED_HOSTNAME: foodsafe.example.invalid
      SMTP_FROM_ADDRESS: noreply@foodsafe.example.invalid
      SMTP_FROM_NAME: FoodSafe
      SMTP_HOST: smtp.example.invalid
      SMTP_PORT: "587"
      SMTP_ENABLE_SSL: "true"
      SMTP_USE_DEFAULT_CREDENTIALS: "false"
      SMTP_USERNAME: ci-render-only
      SMTP_PASSWORD: ci-render-only-password

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FoodSafe.FE/package-lock.json

      - name: Audit backend dependencies
        working-directory: FoodSafe.BE
        run: |
          dotnet restore FoodSafe.sln
          pwsh ../scripts/Test-NuGetVulnerabilities.ps1

      - name: Audit production frontend dependencies
        working-directory: FoodSafe.FE
        run: |
          npm ci
          pwsh ../scripts/Test-NpmVulnerabilities.ps1

      - name: Guard against credentials committed in tracked config (B-3)
        run: bash scripts/scan-committed-secrets.sh

      - name: Guard against .env.example drift (C-6)
        run: bash scripts/verify-env-example-complete.sh

      - name: Scan repository for secrets and insecure configuration
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true
          skip-dirs: FoodSafe.FE/node_modules

      - name: Validate production Compose rendering
        working-directory: FoodSafe.BE
        run: docker compose config --quiet

      - name: Build deployable images
        working-directory: FoodSafe.BE
        # --pull: always re-resolve base-image tags so a warm builder cannot
        # reuse a stale cached base and mask OS package fixes from the scans.
        run: docker compose build --pull api migrator frontend

      - name: Validate production Compose overlay rendering
        working-directory: FoodSafe.BE
        env:
          # Placeholder paths — overlay uses ${SSL_CERT_PATH:?}/${SSL_KEY_PATH:?}
          # only for read-only volume mounts; config rendering just needs them set.
          SSL_CERT_PATH: /tmp/ci-placeholder-tls.crt
          SSL_KEY_PATH: /tmp/ci-placeholder-tls.key
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

      - name: Build production frontend image (Dockerfile.prod)
        working-directory: FoodSafe.BE
        env:
          SSL_CERT_PATH: /tmp/ci-placeholder-tls.crt
          SSL_KEY_PATH: /tmp/ci-placeholder-tls.key
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml build --pull frontend

      - name: Verify production frontend HTTPS/TLS/HSTS/IPv6 at runtime
        run: bash scripts/verify-prod-frontend.sh

      - name: Scan API image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: foodsafe-api:latest
          trivyignores: .trivyignore
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: true

      - name: Scan migrator image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: foodsafe-migrator:latest
          trivyignores: .trivyignore
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: true

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: foodsafe-frontend:latest
          trivyignores: .trivyignore
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: true
