name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # GitHub Container Registry: no cloud-provider billing or federation to keep
  # alive, and the images stay private to this repository.
  REGISTRY: ghcr.io

jobs:
  build-push:
    name: Build & push images
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      image_repo: ${{ steps.repo.outputs.value }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve image repository
        id: repo
        # GHCR rejects upper-case path segments; repository owners may contain them.
        run: echo "value=${REGISTRY}/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >>"$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: FoodSafe.BE
          # Re-resolve base tags on every build; the GHA layer cache must not
          # pin an outdated base digest after upstream security rebuilds.
          pull: true
          push: true
          tags: |
            ${{ steps.repo.outputs.value }}/foodsafe-api:${{ github.sha }}
            ${{ steps.repo.outputs.value }}/foodsafe-api:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: FoodSafe.FE
          pull: true
          push: true
          tags: |
            ${{ steps.repo.outputs.value }}/foodsafe-frontend:${{ github.sha }}
            ${{ steps.repo.outputs.value }}/foodsafe-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build-push
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync compose and Caddy files
        run: |
          scp -i ~/.ssh/deploy_key deploy/docker-compose.cloud.yml \
            "deploy@${{ secrets.VM_HOST }}:/opt/foodsafe/docker-compose.yml"
          scp -i ~/.ssh/deploy_key deploy/Caddyfile \
            "deploy@${{ secrets.VM_HOST }}:/opt/foodsafe/Caddyfile"

      - name: Deploy stack
        env:
          # Scoped to this run and to this repository's packages — the server
          # never stores a long-lived registry credential.
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REPO: ${{ needs.build-push.outputs.image_repo }}
        run: |
          ssh -i ~/.ssh/deploy_key "deploy@${{ secrets.VM_HOST }}" \
            "REGISTRY_TOKEN='$REGISTRY_TOKEN' REGISTRY='${{ env.REGISTRY }}' \
             REGISTRY_USER='${{ github.actor }}' IMAGE_REPO='$IMAGE_REPO' \
             IMAGE_TAG='${{ github.sha }}' bash -s" <<'EOS'
          set -euo pipefail
          cd /opt/foodsafe
          printf '%s' "$REGISTRY_TOKEN" | docker login -u "$REGISTRY_USER" --password-stdin "https://$REGISTRY"
          # Keep .env authoritative for both the repository and the tag so a
          # manual `docker compose up` on the box resolves the same images.
          if grep -q '^IMAGE_REPO=' .env; then
            sed -i "s#^IMAGE_REPO=.*#IMAGE_REPO=$IMAGE_REPO#" .env
          else
            echo "IMAGE_REPO=$IMAGE_REPO" >> .env
          fi
          sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$IMAGE_TAG/" .env
          docker compose pull --quiet
          docker compose up -d --remove-orphans
          docker image prune -f >/dev/null
          EOS

      - name: Verify health
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent --max-time 10 "http://${{ secrets.VM_HOST }}/health" >/dev/null; then
              echo "Health check passed."
              exit 0
            fi
            echo "Waiting for stack to become healthy... ($i/30)"
            sleep 20
          done
          echo "Health check failed after 10 minutes."
          ssh -i ~/.ssh/deploy_key "deploy@${{ secrets.VM_HOST }}" \
            'cd /opt/foodsafe && docker compose ps && docker compose logs --tail=50 api migrator' || true
          exit 1
