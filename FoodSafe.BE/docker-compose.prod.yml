# Production Docker Compose override for FoodSafe.
#
# Activate with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Required environment variables (set in a production .env or secrets manager):
#
#   POSTGRES_SSL_MODE=Require          # minimum; use VerifyCA or VerifyFull with a CA cert
#   SSL_CERT_PATH=/run/secrets/tls.crt # full path inside the container
#   SSL_KEY_PATH=/run/secrets/tls.key  # full path inside the container
#   WEB_BIND_ADDRESS=0.0.0.0           # listen on all interfaces in production
#   WEB_HTTPS_PORT=443                 # host-side HTTPS port
#   WEB_HTTP_PORT=80                   # host-side HTTP redirect port
#
# Certificate volume mounts:
#   Mount your certificate chain and private key as read-only secrets.
#   Do NOT commit certificate files to the repository.
#   Example using Docker secrets or a bind mount:
#     - /etc/letsencrypt/live/foodsafe.example.gov.vn/fullchain.pem:/run/secrets/tls.crt:ro
#     - /etc/letsencrypt/live/foodsafe.example.gov.vn/privkey.pem:/run/secrets/tls.key:ro
#
# nginx configuration:
#   The production nginx image must process nginx.prod.conf.template at startup.
#   The frontend Dockerfile (or a production variant) should:
#     1. Copy docker/nginx.prod.conf.template to /etc/nginx/templates/nginx.conf.template
#        (the official nginx image auto-processes files in /etc/nginx/templates/)
#     2. Expose both 8080 (HTTP redirect) and 8443 (HTTPS).
#
# HTTPS infrastructure evidence still required:
#   - Public TLS certificate issued by a trusted CA for the production hostname
#   - DNS A and AAAA records resolving to the production server
#   - PostgreSQL ssl=on enabled in postgresql.conf on the database server
#   - MinIO TLS certificate (when MINIO_WITH_SSL=true)
#   - Full nginx -t validation against mounted real certificate files

name: foodsafe

services:
  frontend:
    build:
      context: ../FoodSafe.FE
      dockerfile: Dockerfile.prod   # Production variant that uses nginx.prod.conf.template
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_HTTP_PORT:-80}:8080"
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_HTTPS_PORT:-443}:8443"
    volumes:
      - ${SSL_CERT_PATH:?Set SSL_CERT_PATH to the TLS certificate file path}:/run/secrets/tls.crt:ro
      - ${SSL_KEY_PATH:?Set SSL_KEY_PATH to the TLS private key file path}:/run/secrets/tls.key:ro
    environment:
      SSL_CERT_PATH: /run/secrets/tls.crt
      SSL_KEY_PATH: /run/secrets/tls.key
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8080/healthz"
        ]
      interval: 15s
      timeout: 3s
      retries: 5
