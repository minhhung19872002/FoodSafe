# Security response headers shared by every location.
#
# nginx inherits add_header directives from an outer level ONLY when the inner
# level declares no add_header of its own. Both `location /` (Cache-Control)
# and `location /assets/` (Cache-Control) declare one, which silently dropped
# every server-level security header from the SPA document and the JS/CSS
# bundles. Including this file in each of those blocks restores them.
#
# Keep this file as the single source of truth — do not add security headers
# directly to a location block.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tile.openstreetmap.org; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;
add_header Strict-Transport-Security $foodsafe_hsts always;
