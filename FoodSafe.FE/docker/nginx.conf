map $http_x_forwarded_proto $foodsafe_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# HSTS is only meaningful once the browser reached us over TLS. Emitting an
# empty value makes nginx skip the header entirely, so plain-HTTP local
# development never pins 127.0.0.1 into the browser's HSTS preload cache.
map $foodsafe_forwarded_proto $foodsafe_hsts {
    default "";
    "https" "max-age=31536000; includeSubDomains";
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    location = /health {
        access_log off;
        proxy_pass http://api:8080/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $foodsafe_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $foodsafe_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }

    # NOTE ON add_header INHERITANCE: nginx inherits add_header from a parent
    # level only when the current level declares none. /assets/ and / set their
    # own Cache-Control, so they MUST repeat every security header or those
    # responses (including the SPA document) would ship with no CSP/X-Frame.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Server-level headers apply to responses not served by an add_header location.
    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
    gzip_vary on;
}
